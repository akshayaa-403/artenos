# Render Blueprint: New > Blueprint, pick this repo, then paste GEMINI_API_KEY
# when Render asks for it (sync: false keeps it out of the repo).
services:
  - type: web
    name: ask-the-crm
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DAILY_REQUEST_CAP
        value: "300"
      - key: PER_IP_PER_HOUR
        value: "30"
