name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    # No model calls: guard, scoring, checker and stats tests, plus the checker eval.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests
      - run: python -m evals.checker_eval

  eval-gate:
    # Re-scores the live prompt on the frozen test split and fails the build if
    # it is worse than the bar in evals/gate.json. Needs the GEMINI_API_KEY
    # repository secret; skipped when it is not set (e.g. on forks).
    runs-on: ubuntu-latest
    needs: checks
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Gate
        if: env.GEMINI_API_KEY != ''
        run: python -m evals.gate

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    needs: [checks, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ask-the-crm .
